name: Publish ExtensionMesh registry
description: >-
  Build a plugin ZIP compatible with Shopware 6, publish a GitHub Release and
  update the repository's stable ExtensionMesh registry channel.

runs:
  using: composite
  steps:
    - name: Prepare release context
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        release_tag="${EXTENSION_MESH_TAG:-$GITHUB_REF_NAME}"
        output_dir="$RUNNER_TEMP/extension-mesh-release"
        mkdir -p "$output_dir"

        echo "EXTENSION_MESH_TAG=$release_tag" >> "$GITHUB_ENV"
        echo "EXTENSION_MESH_OUTPUT=$output_dir" >> "$GITHUB_ENV"

        if gh release view "$release_tag" >/dev/null 2>&1; then
          echo "Release $release_tag already exists; reusing its registry asset."
          gh release download "$release_tag" \
            --pattern extension-mesh-registry.json \
            --dir "$output_dir"
          echo "exists=true" >> "$GITHUB_OUTPUT"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Configure PHP
      if: steps.release.outputs.exists != 'true'
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: "8.3"
        extensions: json, zip
        coverage: none

    - name: Install Shopware CLI
      if: steps.release.outputs.exists != 'true'
      uses: FriendsOfShopware/shopware-cli-action@b67b48ccb52beb8533ea276152e1f89f29bbd080 # v3
      with:
        version: latest

    - name: Build and validate extension ZIP
      if: steps.release.outputs.exists != 'true'
      shell: bash
      run: |
        shopware-cli extension zip --git-commit "$GITHUB_SHA" . --release
        mapfile -d '' source_archives < <(
          find "$GITHUB_WORKSPACE" -maxdepth 1 -type f \
            -name "*-$GITHUB_SHA.zip" -print0
        )
        if [[ "${#source_archives[@]}" -ne 1 ]]; then
          echo "Expected exactly one extension archive, found ${#source_archives[@]}." >&2
          exit 1
        fi
        source_archive="${source_archives[0]}"
        shopware-cli extension validate "$source_archive"
        echo "EXTENSION_MESH_SOURCE_ARCHIVE=$source_archive" >> "$GITHUB_ENV"

    - name: Build release files
      if: steps.release.outputs.exists != 'true'
      id: build
      shell: bash
      env:
        EXTENSION_MESH_GITHUB_TOKEN: ${{ github.token }}
      run: php "$GITHUB_ACTION_PATH/build-release.php"

    - name: Attest the plugin ZIP
      if: >-
        steps.release.outputs.exists != 'true' &&
        github.event.repository.private == false
      uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
      with:
        subject-path: ${{ steps.build.outputs.archive }}

    - name: Create release and upload assets
      if: steps.release.outputs.exists != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        ARCHIVE: ${{ steps.build.outputs.archive }}
        RELEASE_MANIFEST: ${{ steps.build.outputs.release-manifest }}
        REGISTRY: ${{ steps.build.outputs.registry }}
        CHECKSUMS: ${{ steps.build.outputs.checksums }}
        VERSION: ${{ steps.build.outputs.version }}
      run: |
        release_options=(--draft --generate-notes --target "$GITHUB_SHA")
        if [[ "$VERSION" == *-* ]]; then
          release_options+=(--prerelease)
        fi

        gh release create "$EXTENSION_MESH_TAG" \
          "${release_options[@]}" \
          "$ARCHIVE" \
          "$RELEASE_MANIFEST" \
          "$REGISTRY" \
          "$CHECKSUMS"
        gh release edit "$EXTENSION_MESH_TAG" --draft=false

    - name: Update stable registry channel
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REGISTRY: ${{ runner.temp }}/extension-mesh-release/extension-mesh-registry.json
        VERSION: ${{ steps.build.outputs.version }}
      run: bash "$GITHUB_ACTION_PATH/publish-registry.sh"
