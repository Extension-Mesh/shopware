name: Dockware integration

on:
  workflow_dispatch:
    inputs:
      dockware_image:
        description: Dockware image to test
        required: false
        default: dockware/shopware:6.7.12.1
        type: string
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: dockware-integration
  cancel-in-progress: false

env:
  DOCKWARE_IMAGE: ${{ inputs.dockware_image || 'dockware/shopware:6.7.12.1' }}

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pull integration image
        run: docker pull "$DOCKWARE_IMAGE"

      - name: Set up buyer and seller
        run: make setup

      - name: Run integration tests
        run: make battle-test

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/extension-mesh-dockware"
          docker compose ps -a \
            > "$RUNNER_TEMP/extension-mesh-dockware/compose-ps.txt"
          docker compose logs --no-color \
            > "$RUNNER_TEMP/extension-mesh-dockware/compose.log" 2>&1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dockware-integration-diagnostics
          path: ${{ runner.temp }}/extension-mesh-dockware
          retention-days: 7

      - name: Stop integration environment
        if: always()
        run: docker compose down --volumes --remove-orphans
