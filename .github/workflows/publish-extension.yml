name: Release

on:
  workflow_dispatch:
    inputs:
      dockware_image:
        description: Dockware image used for release verification
        required: false
        default: dockware/shopware:6.7.12.2
        type: string
  push:
    branches:
      - main
    paths:
      - composer.json
      - composer.lock
      - .github/workflows/publish-extension.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        run: |
          version="$(jq -er '.version' composer.json)"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported composer version: $version" >&2
            exit 1
          fi
          echo "EXTENSION_MESH_TAG=v${version}" >> "$GITHUB_ENV"

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: json, sodium, zip
          coverage: pcov

      - name: Install Shopware CLI
        uses: FriendsOfShopware/shopware-cli-action@b67b48ccb52beb8533ea276152e1f89f29bbd080 # v3
        with:
          version: 0.15.3

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate, test, analyse and audit
        run: |
          composer validate --strict --no-check-version
          composer test:administration
          composer coverage
          composer analyse
          composer audit --locked --no-interaction

      - name: Check PHP and shell syntax
        run: |
          find src -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          sh -n docker/registry/build-fixture.sh docker/wait-for-dockware.sh \
            docker/test-interactions.sh docker/test-paid-entitlements.sh \
            docker/test-repository-onboarding.sh

      - name: Build and validate extension ZIP
        run: |
          shopware-cli extension zip --git-commit "$GITHUB_SHA" . --release
          source_archive="$GITHUB_WORKSPACE/ExtensionMesh-$GITHUB_SHA.zip"
          test -f "$source_archive"
          shopware-cli extension validate "$source_archive"

      - name: Preserve the verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-extension-archive
          path: ExtensionMesh-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Validate development environment
        run: |
          docker compose config --quiet
          git diff --check

  integration-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOCKWARE_IMAGE: ${{ inputs.dockware_image || 'dockware/shopware:6.7.12.2' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pull integration image
        run: docker pull "$DOCKWARE_IMAGE"

      - name: Set up buyer and seller
        run: make setup

      - name: Run integration tests
        run: make battle-test

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/extension-mesh-dockware"
          docker compose ps -a \
            > "$RUNNER_TEMP/extension-mesh-dockware/compose-ps.txt"
          docker compose logs --no-color \
            > "$RUNNER_TEMP/extension-mesh-dockware/compose.log" 2>&1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dockware-diagnostics
          path: ${{ runner.temp }}/extension-mesh-dockware
          retention-days: 7

      - name: Stop integration environment
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-current-repository:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs:
      - verify-release
      - integration-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read extension version
        id: extension
        shell: bash
        run: |
          version="$(jq -er '.version' composer.json)"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported composer version: $version" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Download the verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-extension-archive
          path: ${{ runner.temp }}/verified-extension

      - name: Build and publish the compatible package
        env:
          EXTENSION_MESH_TAG: ${{ steps.extension.outputs.tag }}
        uses: Extension-Mesh/shopware-publisher@ddc9b3590a8502679fcffc3fd24f82fd5c68ec88

      - name: Confirm the published ZIP is the verified artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.extension.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/published-extension"
          gh release download "$RELEASE_TAG" \
            --pattern 'ExtensionMesh-*.zip' \
            --dir "$RUNNER_TEMP/published-extension"
          mapfile -d '' verified < <(
            find "$RUNNER_TEMP/verified-extension" -maxdepth 1 -type f -name '*.zip' -print0
          )
          mapfile -d '' published < <(
            find "$RUNNER_TEMP/published-extension" -maxdepth 1 -type f -name '*.zip' -print0
          )
          test "${#verified[@]}" -eq 1
          test "${#published[@]}" -eq 1
          cmp --silent "${verified[0]}" "${published[0]}"
