name: Release

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      dockware_image:
        description: Dockware image used for release verification
        required: false
        default: dockware/shopware:6.7.12.1
        type: string
  push:
    branches:
      - main
    paths:
      - composer.json
      - composer.lock
      - .github/actions/publish-shopware/**
      - .github/workflows/publish-extension.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        run: |
          version="$(jq -er '.version' composer.json)"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported composer version: $version" >&2
            exit 1
          fi
          echo "EXTENSION_MESH_TAG=v${version}" >> "$GITHUB_ENV"

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: json, sodium, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate, test, analyse and audit
        run: |
          composer validate --strict --no-check-version
          composer test
          composer analyse
          composer audit --locked --no-interaction

      - name: Check PHP and shell syntax
        run: |
          find src .github/actions -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          sh -n docker/registry/build-fixture.sh docker/wait-for-dockware.sh \
            docker/test-interactions.sh docker/test-paid-entitlements.sh \
            docker/test-repository-onboarding.sh

      - name: Validate reproducible release archive
        env:
          EXTENSION_MESH_OUTPUT: ${{ runner.temp }}/extension-mesh-release-first
          EXTENSION_MESH_SKIP_HISTORY: "1"
        run: |
          php .github/actions/publish-shopware/build-release.php
          version="${EXTENSION_MESH_TAG#v}"
          archive="ExtensionMesh-${version}.zip"
          unzip -t "$EXTENSION_MESH_OUTPUT/$archive"
          unzip -p "$EXTENSION_MESH_OUTPUT/$archive" \
            ExtensionMesh/composer.json | jq -e --arg version "$version" \
            '.version == $version'
          unzip -Z1 "$EXTENSION_MESH_OUTPUT/$archive" \
            > "$RUNNER_TEMP/extension-mesh-archive-files"
          grep -q '^ExtensionMesh/src/Resources/public/administration/.vite/entrypoints.json$' \
            "$RUNNER_TEMP/extension-mesh-archive-files"
          if grep -Eq '^ExtensionMesh/(.github|docker|tests)/' \
            "$RUNNER_TEMP/extension-mesh-archive-files"; then
            echo "Development files found in release archive" >&2
            exit 1
          fi
          EXTENSION_MESH_OUTPUT="$RUNNER_TEMP/extension-mesh-release-second" \
            php .github/actions/publish-shopware/build-release.php
          cmp \
            "$EXTENSION_MESH_OUTPUT/$archive" \
            "$RUNNER_TEMP/extension-mesh-release-second/$archive"

      - name: Validate development environment
        run: |
          docker compose config --quiet
          git diff --check

  integration-release:
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOCKWARE_IMAGE: ${{ inputs.dockware_image || 'dockware/shopware:6.7.12.1' }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pull integration image
        run: docker pull "$DOCKWARE_IMAGE"

      - name: Set up buyer and seller
        run: make setup

      - name: Run integration tests
        run: make battle-test

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/extension-mesh-dockware"
          docker compose ps -a \
            > "$RUNNER_TEMP/extension-mesh-dockware/compose-ps.txt"
          docker compose logs --no-color \
            > "$RUNNER_TEMP/extension-mesh-dockware/compose.log" 2>&1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dockware-diagnostics
          path: ${{ runner.temp }}/extension-mesh-dockware
          retention-days: 7

      - name: Stop integration environment
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-current-repository:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs:
      - verify-release
      - integration-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the verified source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Read extension version
        id: extension
        shell: bash
        run: |
          version="$(jq -er '.version' composer.json)"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported composer version: $version" >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Check for existing GitHub release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.extension.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; nothing to publish."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and publish the compatible package
        if: steps.release.outputs.exists != 'true'
        env:
          EXTENSION_MESH_TAG: ${{ steps.extension.outputs.tag }}
        uses: ./.github/actions/publish-shopware

  publish-caller:
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Build and publish the compatible package
        uses: extension-mesh/shopware/.github/actions/publish-shopware@v1
