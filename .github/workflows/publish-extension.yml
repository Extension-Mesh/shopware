name: Publish ExtensionMesh registry

on:
  workflow_call:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish-current-repository:
    if: github.event_name == 'push' && contains(github.ref_name, '.')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Build and publish the compatible package
        uses: ./.github/actions/publish-shopware

  publish-caller:
    if: github.event_name == 'workflow_call'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Build and publish the compatible package
        uses: extension-mesh/shopware/.github/actions/publish-shopware@v1
