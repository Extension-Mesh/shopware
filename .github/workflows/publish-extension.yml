name: Release

on:
  workflow_dispatch:
    inputs:
      dockware_image:
        description: Dockware image used for release verification
        required: false
        default: dockware/shopware:6.7.12.2
        type: string
  push:
    branches:
      - main
    paths:
      - composer.json
      - composer.lock
      - .github/workflows/publish-extension.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release context
        id: release
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -er '.version' composer.json)"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Unsupported composer version: $version" >&2
            exit 1
          fi

          tag="v${version}"
          publish=false

          if [[ "$EVENT_NAME" == "push" ]]; then
            previous_version=""
            if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              previous_version="$(
                git show "${BEFORE_SHA}:composer.json" 2>/dev/null \
                  | jq -er '.version' 2>/dev/null \
                  || true
              )"
            fi

            if [[ "$previous_version" == "$version" ]]; then
              echo "Composer version remains ${version}; release publication is skipped."
            else
              if git show-ref --verify --quiet "refs/tags/${tag}" \
                || gh release view "$tag" >/dev/null 2>&1; then
                echo "Release ${tag} already exists and is immutable." >&2
                echo "Increment composer.json version before publishing again." >&2
                exit 1
              fi
              publish=true
            fi
          else
            echo "Manual runs verify the release without publishing it."
          fi

          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: json, sodium, zip
          coverage: pcov

      - name: Install Shopware CLI
        uses: FriendsOfShopware/shopware-cli-action@b67b48ccb52beb8533ea276152e1f89f29bbd080 # v3
        with:
          version: 0.15.3

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate, test, analyse and audit
        run: |
          composer validate --strict --no-check-version
          composer test:administration
          composer coverage
          composer analyse
          composer audit --locked --no-interaction

      - name: Check PHP and shell syntax
        run: |
          find src -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          sh -n docker/registry/build-fixture.sh docker/wait-for-dockware.sh \
            docker/test-interactions.sh docker/test-paid-entitlements.sh \
            docker/test-repository-onboarding.sh

      - name: Build and validate extension ZIP
        run: |
          shopware-cli extension zip --git-commit "$GITHUB_SHA" . --release
          source_archive="$GITHUB_WORKSPACE/ExtensionMesh-$GITHUB_SHA.zip"
          test -f "$source_archive"
          shopware-cli extension validate "$source_archive"

      - name: Preserve the verified release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-extension-archive
          path: ExtensionMesh-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 7

      - name: Validate development environment
        run: |
          docker compose config --quiet
          git diff --check

  integration-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOCKWARE_IMAGE: ${{ inputs.dockware_image || 'dockware/shopware:6.7.12.2' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull integration image
        run: docker pull "$DOCKWARE_IMAGE"

      - name: Set up buyer and seller
        run: make setup

      - name: Run integration tests
        run: make battle-test

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/extension-mesh-dockware"
          docker compose ps -a \
            > "$RUNNER_TEMP/extension-mesh-dockware/compose-ps.txt"
          docker compose logs --no-color \
            > "$RUNNER_TEMP/extension-mesh-dockware/compose.log" 2>&1

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dockware-diagnostics
          path: ${{ runner.temp }}/extension-mesh-dockware
          retention-days: 7

      - name: Stop integration environment
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish-current-repository:
    if: needs.release-context.outputs.publish == 'true'
    needs:
      - release-context
      - verify-release
      - integration-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download the verified release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-extension-archive
          path: ${{ runner.temp }}/verified-extension

      - name: Build and publish the compatible package
        env:
          EXTENSION_MESH_TAG: ${{ needs.release-context.outputs.tag }}
        uses: Extension-Mesh/shopware-publisher@1355c834bb904a01205ff46cc16a81461c3ce4b6
        with:
          source-archive: ${{ runner.temp }}/verified-extension/ExtensionMesh-${{ github.sha }}.zip

      - name: Confirm the published ZIP is the verified artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-context.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/published-extension"
          gh release download "$RELEASE_TAG" \
            --pattern 'ExtensionMesh-*.zip' \
            --dir "$RUNNER_TEMP/published-extension"
          mapfile -d '' verified < <(
            find "$RUNNER_TEMP/verified-extension" -maxdepth 1 -type f -name '*.zip' -print0
          )
          mapfile -d '' published < <(
            find "$RUNNER_TEMP/published-extension" -maxdepth 1 -type f -name '*.zip' -print0
          )
          if [[ "${#verified[@]}" -ne 1 || "${#published[@]}" -ne 1 ]]; then
            echo "Expected one verified and one published ZIP; found ${#verified[@]} and ${#published[@]}." >&2
            exit 1
          fi

          verified_sha="$(sha256sum "${verified[0]}" | cut -d ' ' -f 1)"
          published_sha="$(sha256sum "${published[0]}" | cut -d ' ' -f 1)"
          echo "Verified ZIP SHA-256:  ${verified_sha}"
          echo "Published ZIP SHA-256: ${published_sha}"
          if [[ "$verified_sha" != "$published_sha" ]] \
            || ! cmp --silent "${verified[0]}" "${published[0]}"; then
            echo "Published ZIP differs from the verified release artifact." >&2
            exit 1
          fi
