name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: json, sodium, zip
          coverage: pcov

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate, test, analyse and audit
        run: |
          composer validate --strict --no-check-version
          composer test:administration
          composer coverage
          composer analyse
          composer audit --locked --no-interaction

      - name: Check PHP syntax
        run: |
          find src -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate development environment
        run: |
          docker compose config --quiet
          sh -n docker/registry/build-fixture.sh docker/wait-for-dockware.sh \
            docker/test-interactions.sh docker/test-paid-entitlements.sh \
            docker/test-repository-onboarding.sh
          git diff --check
