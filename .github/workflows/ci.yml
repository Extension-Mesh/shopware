name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: json, sodium, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate, test, analyse and audit
        run: |
          composer validate --strict --no-check-version
          composer test
          composer analyse
          composer audit --locked --no-interaction

      - name: Check PHP syntax
        run: |
          find src .github/actions -name '*.php' -print0 \
            | xargs -0 -n1 php -l
          bash -n .github/actions/publish-shopware/publish-registry.sh

      - name: Validate release archive
        env:
          EXTENSION_MESH_OUTPUT: ${{ runner.temp }}/extension-mesh-ci-release
          EXTENSION_MESH_SKIP_HISTORY: "1"
        run: |
          version="$(jq -er '.version' composer.json)"
          export EXTENSION_MESH_TAG="v${version}"
          archive="ExtensionMesh-${version}.zip"

          php .github/actions/publish-shopware/build-release.php
          unzip -t "$EXTENSION_MESH_OUTPUT/$archive"
          unzip -p "$EXTENSION_MESH_OUTPUT/$archive" \
            ExtensionMesh/composer.json | jq -e --arg version "$version" \
            '.version == $version'
          unzip -Z1 "$EXTENSION_MESH_OUTPUT/$archive" \
            > "$RUNNER_TEMP/extension-mesh-archive-files"
          grep -q '^ExtensionMesh/src/Resources/public/administration/.vite/entrypoints.json$' \
            "$RUNNER_TEMP/extension-mesh-archive-files"
          EXTENSION_MESH_OUTPUT="$RUNNER_TEMP/extension-mesh-ci-release-repeat" \
            php .github/actions/publish-shopware/build-release.php
          cmp \
            "$EXTENSION_MESH_OUTPUT/$archive" \
            "$RUNNER_TEMP/extension-mesh-ci-release-repeat/$archive"

      - name: Validate development environment
        run: |
          docker compose config --quiet
          sh -n docker/registry/build-fixture.sh docker/wait-for-dockware.sh \
            docker/test-interactions.sh docker/test-paid-entitlements.sh \
            docker/test-repository-onboarding.sh
          git diff --check
