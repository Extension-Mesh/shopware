name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: json, sodium, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate, test, analyse and audit
        run: |
          composer validate --strict
          composer test
          composer analyse
          composer audit --locked --no-interaction

      - name: Check PHP syntax
        run: |
          find src .github/actions -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate release archive
        env:
          EXTENSION_MESH_TAG: v0.0.0
          EXTENSION_MESH_OUTPUT: ${{ runner.temp }}/extension-mesh-ci-release
          EXTENSION_MESH_SKIP_HISTORY: "1"
        run: |
          php .github/actions/publish-shopware/build-release.php
          unzip -t "$EXTENSION_MESH_OUTPUT/ExtensionMesh-0.0.0.zip"
          unzip -p "$EXTENSION_MESH_OUTPUT/ExtensionMesh-0.0.0.zip" \
            ExtensionMesh/composer.json | jq -e '.version == "0.0.0"'
          unzip -Z1 "$EXTENSION_MESH_OUTPUT/ExtensionMesh-0.0.0.zip" \
            > "$RUNNER_TEMP/extension-mesh-archive-files"
          grep -q '^ExtensionMesh/src/Resources/public/administration/.vite/entrypoints.json
      - name: Validate development environment
        run: |
          docker compose config --quiet
          sh -n docker/registry/build-fixture.sh docker/wait-for-dockware.sh \
            docker/test-interactions.sh docker/test-paid-entitlements.sh \
            docker/test-repository-onboarding.sh
          git diff --check
 \
            "$RUNNER_TEMP/extension-mesh-archive-files"
          EXTENSION_MESH_OUTPUT="$RUNNER_TEMP/extension-mesh-ci-release-repeat" \
            php .github/actions/publish-shopware/build-release.php
          cmp \
            "$EXTENSION_MESH_OUTPUT/ExtensionMesh-0.0.0.zip" \
            "$RUNNER_TEMP/extension-mesh-ci-release-repeat/ExtensionMesh-0.0.0.zip"

      - name: Validate development environment
        run: |
          docker compose config --quiet
          sh -n docker/registry/build-fixture.sh docker/wait-for-dockware.sh \
            docker/test-interactions.sh docker/test-paid-entitlements.sh \
            docker/test-repository-onboarding.sh
          git diff --check
