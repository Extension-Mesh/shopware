map $http_authorization $extension_mesh_repository_authorized {
    default 0;
    "Bearer private-repo-token" 1;
    "Bearer rotated-private-repo-token" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /github-api/repos/acme/private-plugin {
        if ($extension_mesh_repository_authorized = 0) { return 401; }
        default_type application/json;
        alias /usr/share/nginx/html/github-repository.json;
    }

    location = /github-api/repos/acme/private-plugin/releases {
        if ($extension_mesh_repository_authorized = 0) { return 401; }
        default_type application/json;
        alias /usr/share/nginx/html/github-releases.json;
    }

    location = /github-api/repos/acme/private-plugin/contents/.shopware-extension.yml {
        if ($extension_mesh_repository_authorized = 0) { return 401; }
        default_type application/yaml;
        alias /usr/share/nginx/html/github-shopware-extension.yml;
    }

    location = /github-api/repos/acme/private-plugin/contents/src/Resources/store/description.de.html {
        if ($extension_mesh_repository_authorized = 0) { return 401; }
        default_type text/html;
        alias /usr/share/nginx/html/github-description.de.html;
    }

    location = /github-api/repos/acme/private-plugin/contents/src/Resources/store/description.en.html {
        if ($extension_mesh_repository_authorized = 0) { return 401; }
        default_type text/html;
        alias /usr/share/nginx/html/github-description.en.html;
    }

    location = /github-api/repos/acme/private-plugin/contents/src/Resources/store/icon.png {
        if ($extension_mesh_repository_authorized = 0) { return 401; }
        default_type image/png;
        alias /usr/share/nginx/html/github-icon.png;
    }

    location = /github-api/repos/acme/private-plugin/contents/src/Resources/store/images/en {
        if ($extension_mesh_repository_authorized = 0) { return 401; }
        default_type application/json;
        alias /usr/share/nginx/html/github-images.json;
    }

    location = /github-api/repos/acme/private-plugin/contents/src/Resources/store/images/en/1.png {
        if ($extension_mesh_repository_authorized = 0) { return 401; }
        default_type image/png;
        alias /usr/share/nginx/html/github-image-1.png;
    }

    location = /github-api/repos/acme/private-plugin/releases/assets/1001 {
        if ($extension_mesh_repository_authorized = 0) { return 401; }
        return 302 http://registry-assets/github-assets/AcmeDemoPlugin-1.0.0.zip;
    }

    location = /github-api/repos/acme/private-plugin/releases/assets/1101 {
        if ($extension_mesh_repository_authorized = 0) { return 401; }
        return 302 http://registry-assets/github-assets/AcmeDemoPlugin-1.1.0.zip;
    }

    location = /github-api/repos/acme/public-plugin {
        default_type application/json;
        alias /usr/share/nginx/html/github-public-repository.json;
    }

    location = /github-api/repos/acme/public-plugin/releases {
        default_type application/json;
        alias /usr/share/nginx/html/github-public-releases.json;
    }

    location = /github-api/repos/acme/public-plugin/releases/assets/2001 {
        return 302 http://registry-assets/github-assets/AcmeDemoPlugin-1.0.0.zip;
    }

    location /github-assets/ {
        if ($http_authorization != "") { return 400; }
        try_files $uri =404;
    }

    location / {
        try_files $uri =404;
    }
}
